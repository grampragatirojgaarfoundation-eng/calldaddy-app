<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CallDaddy - Secure QR</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .screen { display: none; }
        .active { display: block; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button.danger { background: #dc3545; }
        .chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .timer { font-size: 24px; text-align: center; font-weight: bold; color: #dc3545; }
        #emergency-contacts { margin-top: 20px; padding: 10px; background: #ffeeba; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Screen 1: Google Login (For QR Owners) -->
    <div id="login-screen" class="screen active">
        <h2 style="text-align: center;">Welcome to CallDaddy</h2>
        <p style="text-align: center; color: #666;">Secure, Private & Masked Connecting</p>
        <div id="g_id_onload"
             data-client_id="48981611712-cph3ipjfjq4lc59eusalcmsp6rg9t62f.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>

    <!-- Screen 2: Owner Profile Setup (First Time) -->
    <div id="profile-screen" class="screen">
        <h2>Setup Profile</h2>
        <input type="text" id="owner-name" placeholder="Full Name (English Letters Only)" maxlength="50" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')">
        <input type="tel" id="owner-mobile" placeholder="Primary Mobile Number" maxlength="15" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <input type="tel" id="em-mobile-1" placeholder="Emergency Number 1" maxlength="15" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <input type="tel" id="em-mobile-2" placeholder="Emergency Number 2 (Optional)" maxlength="15" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <button onclick="saveProfile()">Save & Activate App</button>
    </div>

    <!-- Screen 3: Scanner UI (When someone scans the QR) -->
    <div id="scanner-screen" class="screen">
        <h2>Contact Vehicle Owner</h2>
        <p style="color: green; font-size: 14px;">Connection is 100% Private & Masked.</p>
        <input type="tel" id="scanner-mobile" placeholder="Enter your 10-digit number to connect" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        
        <button onclick="initiateCall()">📞 Call Owner (Free WiFi/Data)</button>
        <button onclick="showChat()" style="background: #28a745;">💬 Send Message</button>
        
        <div id="emergency-contacts" style="display: none;">
            <h4>Emergency Contacts</h4>
            <a id="em-link-1" href="#" style="display:block; text-decoration: none; color: #d32f2f; font-weight: bold;">Dial Emergency 1</a>
            <a id="em-link-2" href="#" style="display:none; text-decoration: none; color: #d32f2f; font-weight: bold; margin-top:10px;">Dial Emergency 2</a>
        </div>
    </div>

    <!-- Screen 4: Active Call UI -->
    <div id="call-screen" class="screen">
        <h2 style="text-align: center;">Secure Call Active</h2>
        <div class="timer" id="call-timer">01:00</div>
        <p style="text-align: center; color: #666;">Call will automatically disconnect in 60 seconds.</p>
        <button class="danger" onclick="endCall()">End Call</button>
        <audio id="remote-audio" autoplay></audio>
    </div>

    <!-- Screen 5: Chat UI -->
    <div id="chat-screen" class="screen">
        <h2>Secure Chat</h2>
        <div class="chat-box" id="chat-box"></div>
        <input type="text" id="chat-input" placeholder="Type message (Max 500 chars)" maxlength="500" oninput="this.value = this.value.replace(/[^a-zA-Z0-9\s]/g, '')">
        <button onclick="sendMessage()">Send</button>
        <button class="danger" onclick="endSession()">End Session</button>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
